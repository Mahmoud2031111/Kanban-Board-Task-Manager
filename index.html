<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board | Task Manager</title>
    <link rel="stylesheet" href="CSS/all.min.css" />
    <link href="CSS/output.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen flex flex-col ">

    <nav
      class="bg-linear-to-r from-indigo-600 to-purple-600 fixed w-full z-20 top-0 inset-s-0 border-b border-default"
    >
      <div
        class="max-w-7xl flex flex-wrap items-center justify-between mx-auto px-4 py-3"
      >
        <a href="" class="flex items-center space-x-3 rtl:space-x-reverse">
          <i class="fa-solid fa-table-columns text-2xl m-2 text-white"></i>
          <span
            class="self-center text-xl text-white font-bold whitespace-nowrap"
            >Kanban</span
          >
        </a>
        <div class="flex md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
          <button
            type="button"
            class="w-10 h-10 rounded-md bg-white/20 hover:bg-white/30 transition-colors flex items-center justify-center"
            id="add-task-btn"
          >
            <i class="fa-solid fa-plus text-white"></i>
          </button>
        </div>
      </div>
    </nav>

    <div 
    id="crud-modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%-1rem)] max-h-full"
    >
      <div class="relative p-4 w-full max-w-md max-h-full">
        <div
          class="relative bg-neutral-primary-soft border border-default rounded-base shadow-sm p-4 md:p-6"
        >
          <div
            class="flex items-center justify-between border-b border-default pb-4 md:pb-5"
          >
            <h2 id="modal-title" class="text-lg font-medium text-heading">
              Create New Task
            </h2>
            <button
              type="button"
              id="modal-close-btn"
              class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center"
            >
              <svg
                class="w-5 h-5"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18 17.94 6M18 18 6.06 6"
                />
              </svg>
              <span class="sr-only">Close modal</span>
            </button>
          </div>
          <form action="#" id="task-form">
            <div class="grid gap-4 grid-cols-2 py-4 md:py-6">
              <div class="col-span-2">
                <label
                  for="task-title"
                  class="block mb-2.5 text-sm font-medium text-slate-700"
                  ><i class="fa-solid fa-heading text-slate-400"></i> Task Title
                  <span class="text-red-500">*</span></label
                >
                <input
                  type="text"
                  name="task-title"
                  id="task-title"
                  class="border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full px-3 py-2.5 shadow-xs placeholder:text-body"
                  placeholder="What needs to be done?"
                  required=""
                />
              </div>
              <div class="col-span-2 sm:col-span-1">
                <label
                  for="priority"
                  class="block mb-2.5 text-sm font-medium text-slate-700"
                  ><i class="fa-solid fa-flag text-slate-400"></i>
                  Priority</label
                >
                <select
                  id="priority"
                  class="block w-full px-3 py-2.5 border border-slate-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 px-3 py-2.5 shadow-xs placeholder:text-body"
                >
                  <option value="low">Low</option>
                  <option value="medium">Medium</option>
                  <option value="high">high</option>
                </select>
              </div>
              <div class="col-span-2 sm:col-span-1">
                <label
                  for="date"
                  class="block mb-2.5 text-sm font-medium text-slate-700"
                  ><i class="fa-regular fa-calendar text-slate-400"></i> Due
                  Date</label
                >
                <input
                  type="date"
                  name="date"
                  id="date"
                  class="border border-slate-300 text-heading text-sm rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full px-3 py-3 shadow-xs"
                  required=""
                />
              </div>
              <div class="col-span-2">
                <label
                  for="description"
                  class="block mb-2.5 text-sm font-medium text-slate-700"
                  ><i class="fa-solid fa-align-left text-slate-400"></i>
                  Description</label
                >
                <textarea
                  id="description"
                  rows="4"
                  class="block border border-slate-300 text-heading text-sm rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 block w-full p-3.5 shadow-xs placeholder:text-body"
                  placeholder="Add more details about this task..."
                ></textarea>
              </div>
            </div>
            <div
              class="flex items-center justify-between space-x-4 pt-4 md:pt-4"
            >
              <button
                id="modal-cancel-btn"
                type="button"
                class="w-1/2 text-body bg-slate-100 hover:bg-slate-200 box-border focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="w-1/2 inline-flex items-center text-white bg-indigo-600 hover:bg-indigo-700 box-border border border-transparent focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none justify-center"
              >
                <svg
                  class="w-4 h-4 me-1.5 -ms-0.5"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 12h14m-7 7V5"
                  />
                </svg>
                <span id="modal-submit-label">Add task</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <main 
    class="flex-1 w-full max-w-7xl mx-auto px-4 pt-24 pb-12">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <section
          class="bg-white border border-default rounded-base shadow-sm p-4"
        >
          <div class="flex items-center gap-3 mb-4">
            <span
              class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center"
            >
              <i class="fa-solid fa-clipboard-list text-slate-500"></i>
            </span>
            <div>
              <h2 class="font-bold text-heading">To Do</h2>
              <p id="todo-count" class="text-xs text-slate-400">0 tasks</p>
            </div>
          </div>
          <div id="todo-list" class="space-y-4"></div>
        </section>

        <section
          class="bg-white border border-default rounded-base shadow-sm p-4"
        >
          <div class="flex items-center gap-3 mb-4">
            <span
              class="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center"
            >
              <i class="fa-solid fa-spinner text-amber-500"></i>
            </span>
            <div>
              <h2 class="font-bold text-heading">In Progress</h2>
              <p id="in-progress-count" class="text-xs text-slate-400">
                0 tasks
              </p>
            </div>
          </div>
          <div id="in-progress-list" class="space-y-4"></div>
        </section>

        <section
          class="bg-white border border-default rounded-base shadow-sm p-4"
        >
          <div class="flex items-center gap-3 mb-4">
            <span
              class="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center"
            >
              <i class="fa-solid fa-circle-check text-emerald-500"></i>
            </span>
            <div>
              <h2 class="font-bold text-heading">Completed</h2>
              <p id="completed-count" class="text-xs text-slate-400">0 tasks</p>
            </div>
          </div>
          <div id="completed-list" class="space-y-4"></div>
        </section>
      </div>
    </main>

    <footer 
    class="bg-slate-800 py-6">
      <p class="text-center text-slate-400 text-sm">
        Made with
        <i class="fa-solid fa-heart animate-pulse text-rose-500"></i> by Mahmoud
        Refaat
      </p>
    </footer>

    <script src="JS/all.min.js"></script>
    <script src="../node_modules/flowbite/dist/flowbite.min.js"></script>
    <script src="JS/main.js"></script>

  </body>
</html>
